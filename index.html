<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

<body>
<header>
  <h1>🛒 متجر الوافي</h1>

    <a href="#products">المنتجات</a>
    <a href="login.html">تسجيل الدخول</a>
    <a href="#cart">السلة (<span id="cart-count">0</span>)</a>

</header>

<section class="product search-box">
  <input id="search-input" type="text" placeholder="🔍 ابحث عن منتج...">
</section>

<section class="product categories">
  <button class="btn category-btn" data-category="all">الكل</button>
  <button class="btn category-btn" data-category="هواتف">هواتف</button>
  <button class="btn category-btn" data-category="إكسسوارات">إكسسوارات</button>

</section>

<section id="products" class="products">
  <div class="product" data-name="هاتف ذكي" data-category="هواتف">
    <a href="product.html?name=هاتف%20ذكي&price=120&category=هواتف&image=https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=500&q=80&desc=هاتف%20ذكي%20بمواصفات%20ممتازة"><img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=500&q=80" alt="هاتف ذكي"></a>
    <h3>هاتف ذكي</h3><p class="price">120$</p>
    <button class="btn add-cart" data-name="هاتف ذكي" data-price="120">أضف للسلة</button>
  </div>
  <div class="product" data-name="سماعة بلوتوث" data-category="إكسسوارات">
    <a href="product.html?name=سماعة%20بلوتوث&price=25&category=إكسسوارات&image=https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80&desc=سماعة%20بلوتوث%20لاسلكية"><img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80" alt="سماعة بلوتوث"></a>
    <h3>سماعة بلوتوث</h3><p class="price">25$</p>
    <button class="btn add-cart" data-name="سماعة بلوتوث" data-price="25">أضف للسلة</button>
  </div>
  <div class="product" data-name="ساعة ذكية" data-category="ساعات">
    <a href="product.html?name=ساعة%20ذكية&price=40&category=ساعات&image=https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80&desc=ساعة%20ذكية%20حديثة"><img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80" alt="ساعة ذكية"></a>
    <h3>ساعة ذكية</h3><p class="price">40$</p>
    <button class="btn add-cart" data-name="ساعة ذكية" data-price="40">أضف للسلة</button>
  </div>
</section>

<section id="cart" class="product"><h2>سلة المشتريات</h2><ul id="cart-items"></ul><h3 id="cart-total">الإجمالي: 0$</h3><a id="whatsapp-order" class="btn" target="_blank">إتمام الطلب عبر واتساب</a></section>
