<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر الوافي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🛒 متجر الوافي</h1>
  <p>أفضل المنتجات بأفضل الأسعار</p>
  <nav>
    <a href="index.html">الرئيسية</a>
    <a href="#products">المنتجات</a>
    <a href="login.html">تسجيل الدخول</a>
    <a href="#cart">السلة (<span id="cart-count">0</span>)</a>
  </nav>
</header>

<section id="products" class="products">
  <div class="product">
    <img src="https://via.placeholder.com/300" alt="هاتف ذكي">
    <h3>هاتف ذكي</h3>
    <p class="price">120$</p>
    <button class="btn add-cart" data-name="هاتف ذكي" data-price="120">أضف للسلة</button>
  </div>
  <div class="product">
    <img src="https://via.placeholder.com/300" alt="سماعة بلوتوث">
    <h3>سماعة بلوتوث</h3>
    <p class="price">25$</p>
    <button class="btn add-cart" data-name="سماعة بلوتوث" data-price="25">أضف للسلة</button>
  </div>
  <div class="product">
    <img src="https://via.placeholder.com/300" alt="ساعة ذكية">
    <h3>ساعة ذكية</h3>
    <p class="price">40$</p>
    <button class="btn add-cart" data-name="ساعة ذكية" data-price="40">أضف للسلة</button>
  </div>
</section>

<section id="cart" class="product">
<h2>سلة المشتريات</h2>
<ul id="cart-items"></ul>
<h3 id="cart-total">الإجمالي: 0$</h3>
</section>

<footer>
  <p>📱 واتساب: +967730705315</p>
  <p>© 2026 متجر الوافي - جميع الحقوق محفوظة</p>
</footer>
<script src="script.js"></script>
</body>
</html>
