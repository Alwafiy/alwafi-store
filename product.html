<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل المنتج - متجر الوافي</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>🛒 تفاصيل المنتج</h1></header>
<section class="product" id="product-details">
<img id="product-image" width="300" alt="المنتج">
<h2 id="product-name"></h2>
<p id="product-desc"></p>
<h3 id="product-price"></h3>

<div class="rating">
<h3>تقييم المنتج</h3>
<div id="stars">
<button data-rate="1">★</button><button data-rate="2">★</button><button data-rate="3">★</button><button data-rate="4">★</button><button data-rate="5">★</button>
</div>
<p id="rating-result">لا يوجد تقييم بعد</p>
</div>

<div class="reviews">
<h3>أضف تعليقك</h3>
<p id="current-user"></p>
<textarea id="review-text" placeholder="اكتب تقييمك"></textarea>
<button id="save-review" class="btn">إضافة التقييم</button>
<ul id="review-list"></ul>
</div>

<button id="add-product" class="btn">أضف للسلة</button>
<br><br>
<a href="index.html">العودة للمتجر</a>
</section>
<script>
const params = new URLSearchParams(location.search);
const name = params.get('name');
const price = params.get('price');
const image = params.get('image');
const desc = params.get('desc');

const user = localStorage.getItem('alwafiUser');
document.getElementById('current-user').textContent = user ? `المستخدم: ${user}` : 'يرجى تسجيل الدخول لإضافة تقييم';

document.getElementById('product-name').textContent = name;
document.getElementById('product-price').textContent = price + '$';
document.getElementById('product-desc').textContent = desc;
document.getElementById('product-image').src = image;

document.getElementById('add-product').onclick = () => {
 let cart = JSON.parse(localStorage.getItem('alwafiCart')) || [];
 cart.push({name, price:Number(price)});
 localStorage.setItem('alwafiCart', JSON.stringify(cart));
 alert('تمت إضافة المنتج إلى السلة');
};

let rating = 0;
document.querySelectorAll('#stars button').forEach(star => {
 star.onclick = () => {
  rating = star.dataset.rate;
  document.getElementById('rating-result').textContent = `تقييمك: ${rating} نجوم`;
 };
});

const reviewKey = 'reviews_' + name;
function loadReviews(){
 const reviews = JSON.parse(localStorage.getItem(reviewKey)) || [];
 document.getElementById('review-list').innerHTML = reviews.map(r => `<li>⭐ ${r.rate}/5 - ${r.user}: ${r.text}</li>`).join('');
}

document.getElementById('save-review').onclick = () => {
 if (!user) {
  alert('يجب تسجيل الدخول أولاً');
  return;
 }
 const reviews = JSON.parse(localStorage.getItem(reviewKey)) || [];
 reviews.push({user, text: document.getElementById('review-text').value, rate: rating || 0});
 localStorage.setItem(reviewKey, JSON.stringify(reviews));
 loadReviews();
};

loadReviews();
</script>
</body>
</html>
